name: Daily Tech Digest

on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = 07:00 KST (매일 한국시간 오전 7시)
  workflow_dispatch: {}     # 필요하면 수동으로도 실행 가능

permissions:
  contents: write           # master에 커밋·push 하기 위한 권한
  id-token: write           # 액션이 GitHub OIDC 토큰을 가져오기 위해 필요

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare date (KST) and folders
        id: prep
        run: |
          TODAY=$(TZ='Asia/Seoul' date +%Y-%m-%d)
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          mkdir -p digests opportunities

      - name: Collect digest with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            오늘 날짜는 ${{ steps.prep.outputs.today }}야. 아래 두 개의 마크다운 파일을 작성해.
            git 커밋·푸시는 워크플로우가 알아서 하니까, 너는 파일 두 개만 정확히 작성하면 돼.

            공통 규칙:
            - 각 주제마다 지정된 사이트를 WebFetch로 직접 방문하고, WebSearch로 보완해.
            - 검색 결과에서 나온 연관 주제도 스스로 확장해서 탐색해.
            - 각 주제당 최소 3~5개 항목을 수집해.
            - 마감·일정이 있는 항목은 반드시 **마감: YYYY-MM-DD** 형태로 명시해.

            ## 파일 1: digests/${{ steps.prep.outputs.today }}.md

            ### 1. PS (알고리즘 문제풀이)
            수집 대상: 한국 내 대회(대학·삼성·AWS 등 기업 주관 포함), Codeforces·AtCoder·DOJ·BOJ 대회, PS 관련 컨퍼런스.
            직접 확인할 사이트:
            - https://dojoi.xyz/ko
            - https://www.acmicpc.net/contest/upcoming
            - https://codeforces.com/contests
            - https://atcoder.jp/contests

            ### 2. 게임 개발
            수집 대상: 게임 개발 컨퍼런스(GDC·NDC 등), Unreal Engine·Unity 등 툴 소식, 국내외 공모전·대회, Steam Next Fest 같은 이벤트, 기타 주목할 행사.

            ### 3. AI 소식
            수집 대상: 새로운 AI 모델 출시·발표, 요즘 주목받는 논문, 최근 자주 언급되는 트렌드.

            digests 파일 형식:
            ```markdown
            # Daily Digest — ${{ steps.prep.outputs.today }}

            > 이 파일은 GitHub Actions에서 Claude에 의해 자동 생성되었습니다.

            ## PS (알고리즘 문제풀이)

            ### [제목](URL)
            > 요약. 대회의 경우 **마감: YYYY-MM-DD** 명시

            ## 게임 개발

            ### [제목](URL)
            > 요약. 마감·날짜가 있는 경우 명시

            ## AI 소식

            ### [제목](URL)
            > 요약
            ```

            ## 파일 2: opportunities/${{ steps.prep.outputs.today }}.md

            각 주제를 WebSearch로 탐색하고 연관 검색으로 확장해. 각 주제당 최소 3~5개 항목.

            ### 1. 인턴십 / 취업 공고
            게임사·AI·SW 기업 인턴 모집, 지원 마감일 포함.

            ### 2. 장학금 / 지원사업
            대학생 대상 장학금, 정부·기업 지원사업, 청년 창업 지원.

            ### 3. 무료 강의 / 학습 자료
            무료·할인 온라인 강의, 공개 컨퍼런스 영상, 주목받는 튜토리얼·오픈코스웨어.

            ### 4. 오픈소스 기여 기회
            GSoC, Outreachy, 기여자 모집 신규 프로젝트, 초보자 친화 이슈.

            opportunities 파일 형식:
            ```markdown
            # Opportunities — ${{ steps.prep.outputs.today }}

            > 이 파일은 GitHub Actions에서 Claude에 의해 자동 생성되었습니다.

            ## 인턴십 / 취업 공고

            ### [제목](URL)
            > 요약. **마감: YYYY-MM-DD** 명시

            ## 장학금 / 지원사업

            ### [제목](URL)
            > 요약. **마감: YYYY-MM-DD** 명시

            ## 무료 강의 / 학습 자료

            ### [제목](URL)
            > 요약

            ## 오픈소스 기여 기회

            ### [제목](URL)
            > 요약
            ```

            두 파일을 모두 작성하면 끝이야. 그 외 다른 파일은 만들지 마.
          claude_args: >-
            --allowedTools "WebSearch,WebFetch,Read,Write,Glob,Bash(date:*),Bash(mkdir:*)"
            --max-turns 60
            --model claude-sonnet-4-6

      - name: Commit and push to master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Daily Digest Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests opportunities
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 커밋 건너뜀."
          else
            git commit -m "docs: daily digest & opportunities ${{ steps.prep.outputs.today }}"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master
          fi
